[package]
name = "des-save-editor"
version = "0.1.0"
edition = "2024"
description = "Save editor for Demon's Souls (PS3) saves used by the RPCS3 emulator"
license = "MIT"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
eframe = "0.37.0"
egui_extras = "0.37"
rfd = "0.17.2"

[build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = true
codegen-units = 1
strip = true
